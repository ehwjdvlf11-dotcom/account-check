<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 계정 조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8">
        
        <!-- 상단 타이틀 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <span>🔍</span> 통합 계정 조회
            </h1>
            <p class="text-slate-400 text-sm mt-1">조회할 항목을 선택하고 코드를 입력하세요.</p>
        </div>

        <!-- 탭 버튼 영역 (일반 계정 / 이메일 구매 계정) -->
        <div class="flex rounded-xl bg-slate-900 p-1 mb-6 border border-slate-700">
            <button id="tab-general" onclick="switchTab('general')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow">
                일반 계정 조회
            </button>
            <button id="tab-email" onclick="switchTab('email')" class="flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
                이메일 구매 계정
            </button>
        </div>

        <!-- [폼 1] 일반 계정 조회 화면 -->
        <div id="form-general" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">발급 코드 입력</label>
                <input type="text" id="input-general-code" placeholder="발급 코드를 입력하세요" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>
            <button onclick="searchAccount('general')" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-colors shadow-lg shadow-indigo-600/30">
                조회하기
            </button>
        </div>

        <!-- [폼 2] 이메일 구매 계정 조회 화면 -->
        <div id="form-email" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">이메일 주문번호 / 코드</label>
                <input type="text" id="input-email-code" placeholder="주문번호 또는 코드를 입력하세요" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>
            <button onclick="searchAccount('email')" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-colors shadow-lg shadow-emerald-600/30">
                이메일 계정 조회하기
            </button>
        </div>

        <!-- 결과 출력 영역 -->
        <div id="result-box" class="mt-6 hidden p-4 bg-slate-900 border border-slate-700 rounded-xl text-sm space-y-2">
            <!-- 조회 결과 표시 -->
        </div>

    </div>

    <script>
        // Supabase 연결 정보 (기존에 쓰시던 주소와 키를 여기에 넣어주세요)
        const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
        const SUPABASE_ANON_KEY = 'your-supabase-anon-key';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase 초기화 실패", e);
        }

        function switchTab(type) {
            const tabGeneral = document.getElementById('tab-general');
            const tabEmail = document.getElementById('tab-email');
            const formGeneral = document.getElementById('form-general');
            const formEmail = document.getElementById('form-email');
            const resultBox = document.getElementById('result-box');

            resultBox.classList.add('hidden');

            if (type === 'general') {
                tabGeneral.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow";
                tabEmail.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
                formGeneral.classList.remove('hidden');
                formEmail.classList.add('hidden');
            } else {
                tabEmail.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow";
                tabGeneral.className = "flex-1 py-2.5 text-sm font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
                formEmail.classList.remove('hidden');
                formGeneral.classList.add('hidden');
            }
        }

        async function searchAccount(type) {
            const inputId = type === 'general' ? 'input-general-code' : 'input-email-code';
            const code = document.getElementById(inputId).value.trim();
            const resultBox = document.getElementById('result-box');

            if (!code) {
                alert('코드를 입력해주세요!');
                return;
            }

            resultBox.innerHTML = `<p class="text-slate-400 text-center">조회 중입니다...</p>`;
            resultBox.classList.remove('hidden');

            try {
                if (!supabaseClient) {
                    throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
                }

                const tableName = type === 'general' ? 'accounts' : 'email_accounts';
                const { data, error } = await supabaseClient
                    .from(tableName)
                    .select('*')
                    .eq('code', code)
                    .single();

                if (error || !data) {
                    resultBox.innerHTML = `<p class="text-rose-400 text-center">❌ 일치하는 정보를 찾을 수 없습니다.</p>`;
                    return;
                }

                resultBox.innerHTML = `
                    <div class="text-emerald-400 font-semibold mb-1">✅ 조회 성공</div>
                    <div class="text-slate-300"><b>계정 정보:</b> ${data.account_info || data.email || '정보 없음'}</div>
                    <div class="text-slate-300"><b>비밀번호:</b> ${data.password || '정보 없음'}</div>
                `;
            } catch (err) {
                console.error(err);
                resultBox.innerHTML = `<p class="text-rose-400 text-center">⚠️ 조회 중 오류가 발생했습니다. (데이터베이스 설정을 확인하세요)</p>`;
            }
        }
    </script>
</body>
</html>
